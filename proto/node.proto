syntax = "proto3";

option go_package = "zeno/pb";

package Node;

message ForwardCommandRequest {
    string command = 1; // "SET", "GET"
    repeated string args = 2; // ["key", "val"]
}
message ForwardCommandResponse {
    bool success = 1;
    string result = 2;
    string error = 3;
    string type = 4;
}

// Heartbeat
message NodeHeartbeatRequest {
    string ping = 1;
}
message NodeHeartbeatResponse {
    string response = 1;
}

service NodeService {
    rpc ForwardCommand(ForwardCommandRequest) returns (ForwardCommandResponse);
    rpc Heartbeat(NodeHeartbeatRequest) returns (NodeHeartbeatResponse);
}
